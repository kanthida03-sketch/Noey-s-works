function workingDates(count, blocked) {
  const out = [];
  const d = today0();
  let guard = 0;
  while (out.length < count && guard < 400) {
    const iso = isoOf(d);
    if (!blocked.has(iso)) out.push(iso);
    d.setDate(d.getDate() + 1);
    guard++;
  }
  return out;
}
