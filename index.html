const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const daysUntil = (iso) => iso ? Math.round((new Date(iso + "T00:00:00") - today0()) / 86400000) : null;

const isoOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
// คืนวันทำงานถัด ๆ ไป count วัน โดยข้ามวันที่อยู่ใน blocked (Set ของ ISO)
function workingDates(count, blocked) {
  const out = []; const d = today0(); let guard = 0;
  while (out.length < count && guard < 400) {
    const iso = isoOf(d);
    if (!blocked.has(iso)) out.push(iso);
    d.setDate(d.getDate() + 1); guard++;
  }
  return out;
}
const deadlineTone = (days) => {

  if (days <= 2) return { c: "text-orange-600", bg: "bg-orange-50", b: "border-orange-200", label: "อีก " + days + " วัน" };
  if (days <= 5) return { c: "text-amber-600", bg: "bg-amber-50", b: "border-amber-200", label: "อีก " + days + " วัน" };

};

  try { const r = await window.storage.get(key); return r && r.value ? JSON.parse(r.value) : fallback; }

}
async function saveKey(key, val) { try { await window.storage.set(key, JSON.stringify(val)); } catch (e) { console.error(e); } }

        {view === "2" && <FreelanceView tasks={tasks} setStatus={setStatus} setPaid={setPaid} onEdit={setEditing}

// จัดงานลงช่องเวลา 30 นาที ตามลำดับ เฉพาะช่องที่ canUse(i)
function packSlots(orderedTasks, SLOTS, canUse) {
  const occ = {}; let i = 0; const overflow = [];
  for (const ot of orderedTasks) {
    const need = Math.max(1, Math.round((ot.minutes || 30) / 30));
    let placed = false;
    for (let s = i; s + need <= SLOTS; s++) {
      let ok = true;
      for (let k = 0; k < need; k++) { if (!canUse(s + k) || occ[s + k]) { ok = false; break; } }
      if (ok) { for (let k = 0; k < need; k++) occ[s + k] = { id: ot.id, start: k === 0, span: need }; i = s + need; placed = true; break; }
    }
    if (!placed) overflow.push(ot.id);
  }
  return { occ, overflow };
}

function Overview({ active, setView, cardProps, blocks, settings, setSettings, planner, setPlanner, plans, courses }) {
  const [tune, setTune] = useState(false);
  const [editItem, setEditItem] = useState(null); // { id, name } กำลังแก้เวลา
  const blockedSet = new Set((blocks || []).map((b) => b.date));
  const wkd = settings.weekdayHrs ?? 2.5;
  const wke = settings.weekendHrs ?? 5;
  const now = today0();
  const todayIso = isoOf(now);
  const todayBlock = (blocks || []).find((b) => b.date === todayIso);

  // งานค้างทั้งหมด (Shopee+ฟรีแลนซ์) เอาเวลาต่องานมารวม = demand (คงที่ทุกช่วง)
  const day = planner[todayIso] || {};
  const durMap = day.dur || {};
  const defaultDur = (t) => t.job === 3 ? Math.max(30, Math.round((Number(t.estHours) || 0.5) * 60)) : 60;
  const sideTasks = active.filter((t) => t.job === 2 || t.job === 3);
  const sideHours = Math.round(sideTasks.reduce((s, t) => s + (durMap[t.id] || defaultDur(t)), 0) / 60 * 10) / 10;

  const actDeduct = (iso) => (plans || []).filter((p) => p.date === iso && !p.done && !(p.allDay || p.period === "allday")).reduce((s, p) => { const min = (Number(p.hours) || 0) * 60 + (Number(p.minutes) || 0); return s + (min >= 180 ? min / 60 : 0); }, 0);

  // ---- capacity for a horizon ----
  const capFor = (horizon) => {
    let capHours = 0; const blk = [];
    const d = today0();
    for (let i = 0; i < horizon; i++) {
      const iso = isoOf(d), dow = d.getDay();
      if (blockedSet.has(iso)) { const b = blocks.find((x) => x.date === iso); if (b) blk.push(b); }
      else capHours += Math.max(0, ((dow === 0 || dow === 6) ? wke : SIDE_HOURS) - actDeduct(iso));
      d.setDate(d.getDate() + 1);
    }
    capHours = Math.round(capHours * 10) / 10;
    const demand = sideHours;
    const ratio = capHours > 0 ? demand / capHours : (demand > 0 ? 9 : 0);
    let verdict, vColor, vBar, vText;
    if (ratio <= 0.7) { verdict = "รับงานเพิ่มได้"; vColor = "text-emerald-600"; vBar = "bg-emerald-500"; vText = "งานค้างยังไม่ล้นเวลาช่วงนี้"; }
    else if (ratio <= 1) { verdict = "แน่นแล้ว"; vColor = "text-amber-600"; vBar = "bg-amber-500"; vText = "งานค้างเกือบเต็มเวลาช่วงนี้"; }
    else { verdict = "เกินแล้ว"; vColor = "text-red-600"; vBar = "bg-red-500"; vText = "งานค้างล้นเวลาช่วงนี้ — เลื่อนบางงาน/อย่ารับเพิ่ม"; }
    return { horizon, capHours, demand, ratio, pct: Math.min(100, Math.round(ratio * 100)), verdict, vColor, vBar, vText, blk };
  };
  const HZ = [{ v: 1, l: "วันนี้" }, { v: 3, l: "3 วัน" }, { v: 7, l: "7 วัน" }];

  // ---- today's tasks across all jobs, by urgency ----
  const JOBDOT = { 1: "bg-indigo-500", 2: "bg-amber-500", 3: "bg-teal-500" };
  const JOBNAME = { 1: "Ignite", 2: "ฟรีแลนซ์", 3: "Shopee" };
  const rank = (t) => { const du = daysUntil(t.deadline); return du === null ? 99999 : du; };
  const todayJobs = [...active].sort((a, b) => rank(a) - rank(b));
  const subLabel = (t) => t.job === 1 ? (t.phase || "") : t.job === 2 ? (t.step || "") : "";

  // ---- daily planner (30-min, zone-aware, items = งาน+กิจกรรม+คอร์ส) ----
  const notes = day.notes || {};
  const startAt = day.startAt || {};
  const SLOTS = 38; // 05:00 .. 23:30
  const slotHour = (i) => 5 + Math.floor(i / 2);
  const slotTime = (i) => slotHour(i) + (i % 2) * 0.5;
  const slotLabel = (i) => String(slotHour(i)).padStart(2, "0") + (i % 2 ? ":30" : ":00");
  const inWin = (t, wins) => wins.some(([a, b]) => t >= a && t < b);
  const slotZone = (i) => { const t = slotTime(i); if (inWin(t, SIDE_WINDOWS)) return "side"; if (inWin(t, IGNITE_WINDOWS)) return "ignite"; const h = slotHour(i); if (h >= 9 && h < 18 && !(h >= 12 && h < 13)) return "company"; return "free"; };
  const isCompanyVisual = (i) => { const z = slotZone(i); return z === "company" || z === "ignite"; };
  const timeToSlot = (hhmm) => { if (!hhmm) return null; const q = hhmm.split(":"); const h = Number(q[0]), m = Number(q[1]); if (isNaN(h) || h < 5 || h >= 24) return null; return (h - 5) * 2 + (m >= 30 ? 1 : 0); };

  // สร้างรายการทั้งหมดของวันนี้ (งานบริษัท·ฟรีแลนซ์·ร้าน·กิจกรรม·คอร์ส)
  const items = [];
  active.filter((t) => t.job === 1 && t.status === "inprogress").forEach((t) => items.push({ id: t.id, name: t.title + (t.phase ? " · " + t.phase : ""), group: "ignite", color: 1, dur: durMap[t.id] || 60 }));
  active.filter((t) => t.job === 2 && t.status === "inprogress").forEach((t) => items.push({ id: t.id, name: t.title + (t.step ? " · " + t.step : ""), group: "side", color: 2, dur: durMap[t.id] || 60 }));
  active.filter((t) => t.job === 3).forEach((t) => items.push({ id: t.id, name: t.title, group: "side", color: 3, dur: durMap[t.id] || Math.max(30, Math.round((Number(t.estHours) || 0.5) * 60)) }));
  (plans || []).filter((p) => p.date === todayIso && !p.done && !(p.allDay || p.period === "allday")).forEach((p) => items.push({ id: p.id, name: p.name, group: "side", color: "act", dur: durMap[p.id] || ((Number(p.hours) || 0) * 60 + (Number(p.minutes) || 0)) || 30 }));
  (courses || []).forEach((c) => { const sc = courseSchedule(c, blockedSet); const k = sc.indexOf(todayIso); if (k >= 0 && !(c.done || []).includes(k)) items.push({ id: "course_" + c.id, name: "คอร์ส: " + c.name, group: "side", color: "course", dur: durMap["course_" + c.id] || (Number(c.minutes) || 30) }); });

  const itemIds = items.map((x) => x.id);
  const order = (day.order || []).filter((id) => itemIds.includes(id));
  items.forEach((x) => { if (!order.includes(x.id)) order.push(x.id); });
  const byId = (id) => items.find((x) => x.id === id);

  // แพ็คลงช่อง: งานที่ระบุเวลา (ล็อก) ก่อน แล้วค่อยจัดอัตโนมัติในช่วงว่าง
  const occ = {}; const overflow = [];
  const place = (it, s) => { const need = Math.max(1, Math.round(it.dur / 30)); for (let k = 0; k < need; k++) { if (s + k >= SLOTS || occ[s + k]) return false; } for (let k = 0; k < need; k++) occ[s + k] = { id: it.id, start: k === 0, span: need, color: it.color }; return true; };
  order.map(byId).filter(Boolean).forEach((it) => { const s = timeToSlot(startAt[it.id]); if (s != null) { if (!place(it, s)) overflow.push(it.id); } });
  const autoPack = (grp) => { let i = 0; order.map(byId).filter((it) => it && it.group === grp && timeToSlot(startAt[it.id]) == null).forEach((it) => { const need = Math.max(1, Math.round(it.dur / 30)); let placed = false; for (let s = i; s + need <= SLOTS; s++) { let ok = true; for (let k = 0; k < need; k++) { if (slotZone(s + k) !== grp || occ[s + k]) { ok = false; break; } } if (ok) { for (let k = 0; k < need; k++) occ[s + k] = { id: it.id, start: k === 0, span: need, color: it.color }; i = s + need; placed = true; break; } } if (!placed) overflow.push(it.id); }); };
  autoPack("side"); autoPack("ignite");

  const updateDay = (patch) => setPlanner((prev) => ({ ...prev, [todayIso]: { ...(prev[todayIso] || {}), ...patch } }));
  const moveInGroup = (id, dir) => { const it = byId(id); if (!it) return; const group = order.map(byId).filter((x) => x && x.group === it.group && timeToSlot(startAt[x.id]) == null).map((x) => x.id); const gi = group.indexOf(id), gj = gi + dir; if (gj < 0 || gj >= group.length) return; const ng = group.slice(); const tmp = ng[gi]; ng[gi] = ng[gj]; ng[gj] = tmp; let k = 0; const newOrder = order.map((oid) => group.includes(oid) ? ng[k++] : oid); updateDay({ order: newOrder }); };
  const setDur = (id, m) => updateDay({ dur: { ...durMap, [id]: m } });
  const setStartAt = (id, v) => updateDay({ startAt: { ...startAt, [id]: v } });
  const setNote = (i, v) => updateDay({ notes: { ...notes, [i]: v } });
  const ITEMBG = { 1: "bg-indigo-100", 2: "bg-amber-100", 3: "bg-teal-100", act: "bg-rose-100", course: "bg-violet-100" };
  const ITEMDOT = { 1: "bg-indigo-500", 2: "bg-amber-500", 3: "bg-teal-500", act: "bg-rose-500", course: "bg-violet-500" };
  const DURS = [{ m: 30, l: "30น" }, { m: 60, l: "1ชม" }, { m: 90, l: "1.5" }, { m: 120, l: "2ชม" }];
  const editing = editItem ? byId(editItem) : null;

  return (
    <div className="space-y-5">
      <div className="rounded-2xl bg-stone-900 text-white p-4">
        <p className="text-[11px] tracking-[0.2em] uppercase text-stone-400">วันนี้</p>
        <p className="text-xl font-bold mt-0.5">{THAI_DOW_FULL[now.getDay()]} {now.toLocaleDateString("th-TH", { day: "numeric", month: "long" })}</p>
        {todayBlock && <p className="text-sm text-amber-300 mt-1">วันนี้ไม่ว่าง: {todayBlock.label}</p>}
      </div>

      {/* swipeable capacity */}
      <div>
        <div className="flex gap-3 overflow-x-auto pb-1" style={{ scrollSnapType: "x mandatory", scrollbarWidth: "none" }}>
          {HZ.map((h) => {
            const c = capFor(h.v);
            return (
              <div key={h.v} className="shrink-0 rounded-2xl border border-stone-200 bg-white p-4" style={{ minWidth: "86%", scrollSnapAlign: "center" }}>
                <div className="flex items-center justify-between mb-1">
                  <span className="text-xs font-semibold text-stone-500">{h.l}</span>
                  <span className="text-sm text-stone-500">{c.demand} / {c.capHours} ชม.</span>
                </div>
                <div className={"text-xl font-bold " + c.vColor}>{c.verdict}</div>
                <div className="h-2.5 rounded-full bg-stone-100 overflow-hidden my-2">
                  <div className={"h-full rounded-full " + c.vBar} style={{ width: c.pct + "%" }} />
                </div>
                <p className="text-xs text-stone-500">{c.vText}</p>
                {c.blk.length > 0 && <div className="flex flex-wrap gap-1.5 mt-2">{c.blk.map((b) => <span key={b.id} className="text-[11px] text-amber-700 bg-amber-50 rounded-full px-2 py-0.5">ไม่ว่าง {fmtThaiDate(b.date)}</span>)}</div>}
              </div>
            );
          })}
        </div>
        <p className="text-center text-[11px] text-stone-400 mt-1">← ปัดดู วันนี้ · 3 วัน · 7 วัน →</p>
        <button onClick={() => setTune(!tune)} className="text-xs text-stone-500 mt-1 mx-auto block">{tune ? "ซ่อน" : "ปรับเวลาทำงาน"}</button>
        {tune && (
          <div className="mt-2 space-y-2 rounded-xl border border-stone-200 p-3">
            <p className="text-xs text-stone-500">เวลาว่างวันธรรมดา (ฟรีแลนซ์/ร้าน): 06:00–08:00 · พักเที่ยง · 20:00–21:30 = <span className="font-semibold text-stone-700">{SIDE_HOURS} ชม.</span></p>
            <label className="flex items-center justify-between text-sm text-stone-600">เสาร์/อาทิตย์ (ต่อวัน)
              <span className="flex items-center gap-2"><input type="number" step="0.5" min="0" value={wke} onChange={(e) => setSettings({ ...settings, weekendHrs: Number(e.target.value) })} className="w-16 text-right rounded-lg border border-stone-300 px-2 py-1 text-sm" /> ชม.</span></label>
          </div>
        )}
      </div>

      {/* timeline 30-min */}
      <div>
        <div className="flex items-baseline justify-between mb-1 px-1">
          <h2 className="font-bold text-stone-900">ตารางวันนี้</h2>
          {overflow.length > 0 && <span className="text-xs text-red-500">ไม่พอเวลา {overflow.length} งาน</span>}
        </div>
        <p className="text-xs text-stone-400 mb-2 px-1">แตะ ✏️ ตั้งเวลา/ระยะเวลา · งานที่ไม่ล็อกเวลาเลื่อน ▲▼ ได้ · ช่องว่างพิมพ์เองได้</p>
        <div className="rounded-2xl border border-stone-200 bg-white overflow-hidden divide-y divide-stone-100">
          {Array.from({ length: SLOTS }).map((_, i) => {
            const zone = slotZone(i);
            const comp = isCompanyVisual(i);
            const o = occ[i];
            const it = o && byId(o.id);
            const fixed = o && timeToSlot(startAt[o.id]) != null;
            const bg = o ? (ITEMBG[o.color] || "") : (comp ? "bg-indigo-50" : (zone === "side" ? "bg-amber-50/50" : ""));
            return (
              <div key={i} className={"flex items-stretch " + bg}>
                <div className="w-14 shrink-0 px-2 py-2 text-[11px] text-stone-400 border-r border-stone-100 flex items-center">{slotLabel(i)}</div>
                {o
                  ? (o.start
                      ? <div className="flex-1 px-3 py-2 min-w-0 flex items-center gap-2">
                          <span className={"w-2 h-2 rounded-full shrink-0 " + ITEMDOT[o.color]} />
                          <span className="text-sm font-medium text-stone-800 truncate flex-1">{it ? it.name : ""}</span>
                          <span className="text-[11px] text-stone-400 shrink-0">{o.span * 30}น</span>
                          {fixed
                            ? <span className="text-[10px] text-stone-400 shrink-0">🔒</span>
                            : <div className="flex flex-col shrink-0 -my-1">
                                <button onClick={() => moveInGroup(o.id, -1)} className="text-stone-400 text-[10px] leading-none">▲</button>
                                <button onClick={() => moveInGroup(o.id, 1)} className="text-stone-400 text-[10px] leading-none">▼</button>
                              </div>}
                          <button onClick={() => setEditItem(o.id)} className="text-stone-400 shrink-0"><Pencil size={14} /></button>
                        </div>
                      : <div className="flex-1 px-3 py-2 text-xs flex items-center"><span className="text-stone-300">↳</span></div>)
                  : comp
                    ? <div className="flex-1 px-3 py-2 text-xs text-indigo-500 flex items-center gap-1.5">{slotHour(i) === 9 && i % 2 === 0 ? <><Briefcase size={12} /> งานบริษัท (เข้างาน)</> : ""}</div>
                    : <input value={notes[i] || ""} onChange={(e) => setNote(i, e.target.value)} placeholder={zone === "side" ? "ทำฟรีแลนซ์/ร้าน…" : "…"} className="flex-1 px-3 py-2 text-sm bg-transparent focus:outline-none focus:bg-stone-50 placeholder-stone-300" />}
              </div>
            );
          })}
        </div>
      </div>

      {/* edit item popup */}
      {editing && (
        <div className="fixed inset-0 z-40 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/40" onClick={() => setEditItem(null)} />
          <div className="relative bg-white w-full max-w-sm rounded-3xl p-5 shadow-xl space-y-3">
            <p className="font-bold text-stone-900 truncate">{editing.name}</p>
            <div>
              <p className="text-xs text-stone-500 mb-1.5">ใช้เวลาทำ</p>
              <div className="flex gap-2">
                {DURS.map((d) => <button key={d.m} onClick={() => setDur(editing.id, d.m)} className={"flex-1 rounded-lg border py-2 text-sm " + ((durMap[editing.id] || editing.dur) === d.m ? "bg-stone-900 text-white border-transparent" : "border-stone-200 text-stone-500")}>{d.l}</button>)}
              </div>
            </div>
            <div>
              <p className="text-xs text-stone-500 mb-1.5">เวลาเริ่ม (ไม่ระบุก็ได้ · ระบุแล้วจะล็อกเวลานั้น)</p>
              <div className="flex items-center gap-2">
                <input type="time" value={startAt[editing.id] || ""} onChange={(e) => setStartAt(editing.id, e.target.value)}
                  className="rounded-lg border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400" />
                {startAt[editing.id] && <button onClick={() => setStartAt(editing.id, "")} className="text-sm text-stone-400">ล้าง (จัดอัตโนมัติ)</button>}
              </div>
            </div>
            <button onClick={() => setEditItem(null)} className="w-full rounded-xl bg-stone-900 text-white py-2.5 text-sm font-medium">เสร็จ</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============ Ignite view (overview list for boss) ============ */
const IG_STLABEL = { notset: "ยังไม่เริ่ม", inprogress: "กำลังทำ", followup: "รอติดตาม" };
function exportIgniteSummary(tasks) {
  const active = tasks.filter((t) => t.job === 1 && t.status !== "done" && t.status !== "cancel");
  const rk = (t) => { const du = daysUntil(t.deadline); return du === null ? 99999 : du; };
  active.sort((a, b) => rk(a) - rk(b));
  const header = ["ลำดับ", "ชื่องาน", "Phase", "Type", "Owner", "Status", "Priority", "กำหนดส่ง", "เหลือ (วัน)", "วันที่ได้รับ", "โน้ต"];
  const rows = active.map((t, i) => {
    const du = daysUntil(t.deadline);
    return {
      "ลำดับ": i + 1, "ชื่องาน": t.title || "", "Phase": t.phase || "", "Type": t.type || "", "Owner": t.owner || "",
      "Status": IG_STLABEL[t.status || "notset"], "Priority": t.priority || "",
      "กำหนดส่ง": t.deadline ? fmtThaiDate(t.deadline) : "",
      "เหลือ (วัน)": (t.deadline && du !== null) ? du : "",
      "วันที่ได้รับ": t.assignedDate ? fmtThaiDate(t.assignedDate) : "", "โน้ต": t.notes || "",
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows, { header });
  ws["!cols"] = [{ wch: 6 }, { wch: 26 }, { wch: 12 }, { wch: 10 }, { wch: 8 }, { wch: 11 }, { wch: 8 }, { wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 30 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "สรุปงาน");
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  XLSX.writeFile(wb, `สรุปงาน-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.xlsx`);
}

function exportIgniteDone(tasks) {
  const closed = tasks.filter((t) => t.job === 1 && (t.status === "done" || t.status === "cancel"));
  closed.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const header = ["โปรเจค", "Phase", "Type", "Owner", "Priority", "สถานะ", "กำหนดส่ง", "วันที่จบ"];
  const rows = closed.map((t) => ({
    "โปรเจค": t.title || "", "Phase": t.phase || "", "Type": t.type || "", "Owner": t.owner || "",
    "Priority": t.priority || "", "สถานะ": t.status === "cancel" ? "ยกเลิก" : "เสร็จ",
    "กำหนดส่ง": t.deadline ? fmtThaiDate(t.deadline) : "",
    "วันที่จบ": t.updatedAt ? new Date(t.updatedAt).toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" }) : "",
  }));
  const ws = XLSX.utils.json_to_sheet(rows, { header });
  ws["!cols"] = header.map((h) => ({ wch: h === "โปรเจค" ? 26 : 12 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "งานที่จบ");
  const d = new Date(); const pad = (n) => String(n).padStart(2, "0");
  XLSX.writeFile(wb, `งานบริษัทที่จบ-${d.getFullYear()}${pad(d.getMonth() + 1)}.xlsx`);
}

/* งานที่จบ — รวมชื่อเดียวกันเป็นโปรเจคเดียว กางดูขั้นย่อยได้ + นับเดือน/ปี */
function DoneList({ all, renderCard, exportFn }) {
  const [open, setOpen] = useState({});
  const nowD = new Date();
  const [mode, setMode] = useState("M"); // Y | M | All
  const [cy, setCy] = useState(nowD.getFullYear());
  const [cm, setCm] = useState(nowD.getMonth());
  const THMON = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  const closed = all.filter((t) => t.status === "done" || t.status === "cancel");
  const activeTitles = new Set(all.filter((t) => t.status !== "done" && t.status !== "cancel").map((t) => t.title));
  const groups = {};
  closed.forEach((t) => { (groups[t.title] = groups[t.title] || []).push(t); });
  const finishTime = (title) => Math.max(0, ...groups[title].map((t) => t.updatedAt || 0));
  const finishedTitles = Object.keys(groups).filter((title) => !activeTitles.has(title));

  const inPeriod = (ts) => { if (mode === "All") return true; const d = new Date(ts); if (mode === "Y") return d.getFullYear() === cy; return d.getFullYear() === cy && d.getMonth() === cm; };
  const shift = (dir) => { if (mode === "Y") setCy((y) => y + dir); else if (mode === "M") { let m = cm + dir, y = cy; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } setCm(m); setCy(y); } };
  const be = cy + 543;
  const label = mode === "All" ? "ทั้งหมด" : mode === "Y" ? ("ปี " + be) : (THMON[cm] + " " + be);
  const inTitles = finishedTitles.filter((t) => inPeriod(finishTime(t))).sort((a, b) => finishTime(b) - finishTime(a));

  if (closed.length === 0) return <EmptyState title="ยังไม่มีงานที่จบ" sub="งานที่กด ‘จบโปรเจค’ จะมารวมที่นี่" />;

  const pill = (active) => "rounded-full px-3.5 py-1.5 text-sm font-bold " + (active ? "bg-stone-900 text-white" : "bg-stone-100 text-stone-500");
  return (
    <div className="space-y-3">
      <div className="flex items-center gap-2">
        <button onClick={() => setMode("Y")} className={pill(mode === "Y")}>Y</button>
        <button onClick={() => setMode("M")} className={pill(mode === "M")}>M</button>
        <div className="flex-1 flex items-center justify-center gap-2">
          {mode !== "All" && <button onClick={() => shift(-1)} className="text-stone-400 text-xl px-1 leading-none">‹</button>}
          <span className="font-bold text-stone-900 text-sm">{label}</span>
          {mode !== "All" && <button onClick={() => shift(1)} className="text-stone-400 text-xl px-1 leading-none">›</button>}
        </div>

const FL_STEPS = ["เสนอแบบ", "แก้ไข(1)", "แก้ไข(2)", "แก้ไข(3)", "แก้ไข(4)", "แก้ไขเกิน", "เตรียมไฟล์", "อื่นๆ"];
const FL_CHANNELS = ["Fastwork", "ส่วนตัว"];
function exportFreelanceSummary(tasks) {
  const active = tasks.filter((t) => t.job === 2 && t.status !== "done" && t.status !== "cancel");
  const rk = (t) => { const du = daysUntil(t.deadline); return du === null ? 99999 : du; };
  active.sort((a, b) => rk(a) - rk(b));
  const baht = (n) => (n ? Number(n).toLocaleString("th-TH") : "");
  const header = ["ลำดับ", "โปรเจค", "ขั้นตอน", "ลูกค้า", "ราคา", "Status", "กำหนดส่ง", "เหลือ (วัน)", "โน้ต"];
  const rows = active.map((t, i) => { const du = daysUntil(t.deadline); return {
    "ลำดับ": i + 1, "โปรเจค": t.title || "", "ขั้นตอน": t.step || "", "ลูกค้า": t.client || "", "ราคา": baht(t.price),
    "Status": IG_STLABEL[t.status || "notset"], "กำหนดส่ง": t.deadline ? fmtThaiDate(t.deadline) : "",
    "เหลือ (วัน)": (t.deadline && du !== null) ? du : "", "โน้ต": t.notes || "" }; });
  const ws = XLSX.utils.json_to_sheet(rows, { header });
  ws["!cols"] = header.map((h) => ({ wch: h === "โปรเจค" || h === "โน้ต" ? 26 : 11 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "สรุปฟรีแลนซ์");
  const d = new Date(); const pad = (n) => String(n).padStart(2, "0");
  XLSX.writeFile(wb, `สรุปฟรีแลนซ์-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.xlsx`);
}

/* ============ sticker layout calculator ============ */
const PKEY = "noey-sticker-presets-v1";
const PAPERS = { A3: [297, 420], A4: [210, 297] };
// ค่ามาตรฐานของเนย (mm)
const M_SIDE = 12;    // ขอบซ้าย/ขวา
const M_TOP = 12;     // ขอบบน
const M_BOTTOM = 25;  // ขอบล่าง (ไว้จับกระดาษ)
const GAP = 4;        // ระยะห่างระหว่างชิ้น
const CORNER = 10;    // มุมด้านในเว้น 10×10 (จุดมาร์คไดคัท)

function usable(paper) {
  const [pw, ph] = PAPERS[paper];
  return [pw - 2 * M_SIDE, ph - M_TOP - M_BOTTOM];
}
function fitGrid(wmm, hmm, uw, uh) {
  const g = (cw, ch) => ({ cols: Math.max(0, Math.floor((uw + GAP) / (cw + GAP))), rows: Math.max(0, Math.floor((uh + GAP) / (ch + GAP))) });
  const a = g(wmm, hmm), b = g(hmm, wmm);
  const na = a.cols * a.rows, nb = b.cols * b.rows;
  return nb > na ? { n: nb, cols: b.cols, rows: b.rows, rot: true } : { n: na, cols: a.cols, rows: a.rows, rot: false };
}
function fitHex(d, uw, uh) {
  const colPitch = d + GAP, rowPitch = (d + GAP) * Math.sqrt(3) / 2;
  const cols = Math.max(0, Math.floor((uw + GAP) / colPitch));
  if (cols <= 0 || uh < d) return { n: 0, rows: 0 };
  const rows = Math.max(1, Math.floor((uh - d) / rowPitch) + 1);
  const offCols = Math.max(0, Math.floor((uw + GAP - colPitch / 2) / colPitch));
  const n = Math.ceil(rows / 2) * cols + Math.floor(rows / 2) * offCols;
  return { n, rows };
}

function StickerCalc() {
  const [open, setOpen] = useState(false);
  const [w, setW] = useState(3);
  const [h, setH] = useState(3);
  const [shape, setShape] = useState("circle");
  const [paper, setPaper] = useState("A3");
  const [stagger, setStagger] = useState(true);
  const [presets, setPresets] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => { (async () => { setPresets(await loadKey(PKEY, [])); setLoaded(true); })(); }, []);
  useEffect(() => { if (loaded) saveKey(PKEY, presets); }, [presets, loaded]);

  const [uw, uh] = usable(paper);
  const grid = fitGrid((Number(w) || 0) * 10, (Number(h) || 0) * 10, uw, uh);
  const hex = shape === "circle" ? fitHex((Number(w) || 0) * 10, uw, uh) : null;
  const isCircle = shape === "circle";
  const useHex = isCircle && stagger;
  const n = useHex ? hex.n : grid.n;

  const save = () => {
    const label = (isCircle ? "⬤ " : "▢ ") + w + "×" + h + " ซม. บน " + paper + (useHex ? " (สลับ)" : "");
    setPresets((p) => [{ id: "p_" + Date.now(), label, n }, ...p.filter((x) => x.label !== label)].slice(0, 20));
  };
  const numCls = "w-16 rounded-lg border border-stone-300 px-2 py-1.5 text-sm text-center focus:outline-none focus:ring-2 focus:ring-teal-400";

  return (
    <div className="rounded-2xl border border-teal-200 bg-white overflow-hidden">
      <button onClick={() => setOpen(!open)} className="w-full flex items-center justify-between p-3.5">
        <span className="flex items-center gap-2 font-medium text-teal-700"><Calculator size={18} /> คำนวณการวางสติ๊กเกอร์</span>
        <span className="text-stone-400 text-sm">{open ? "ซ่อน" : "เปิด"}</span>

      {open && (
        <div className="px-3.5 pb-4 space-y-3 border-t border-stone-100 pt-3">

            <span className="text-sm text-stone-600">ขนาดดวง</span>
            <input type="number" step="0.1" min="0" value={w} onChange={(e) => { setW(e.target.value); if (isCircle) setH(e.target.value); }} className={numCls} />
            <span className="text-stone-400">×</span>
            <input type="number" step="0.1" min="0" value={h} onChange={(e) => setH(e.target.value)} disabled={isCircle} className={numCls + (isCircle ? " bg-stone-100 text-stone-400" : "")} />
            <span className="text-sm text-stone-400">ซม.</span>
          </div>

          <div className="flex gap-2">
            <button onClick={() => { setShape("circle"); setH(w); }}
              className={"flex-1 rounded-lg border py-1.5 text-sm " + (isCircle ? "bg-stone-900 text-white border-transparent" : "border-stone-200 text-stone-500")}>⬤ วงกลม</button>
            <button onClick={() => setShape("rect")}
              className={"flex-1 rounded-lg border py-1.5 text-sm " + (!isCircle ? "bg-stone-900 text-white border-transparent" : "border-stone-200 text-stone-500")}>▢ สี่เหลี่ยม</button>
          </div>

          <div className="flex flex-wrap items-center gap-2">
            <span className="text-sm text-stone-600">กระดาษ</span>
            {Object.keys(PAPERS).map((p) => (
              <button key={p} onClick={() => setPaper(p)}
                className={"rounded-lg border px-3 py-1 text-sm " + (paper === p ? "bg-teal-600 text-white border-transparent" : "border-stone-200 text-stone-500")}>{p}</button>
            ))}
          </div>

          {isCircle && (
            <div className="flex gap-2">
              <button onClick={() => setStagger(false)}
                className={"flex-1 rounded-lg border py-1.5 text-sm " + (!stagger ? "bg-teal-600 text-white border-transparent" : "border-stone-200 text-stone-500")}>เรียงตาราง</button>
              <button onClick={() => setStagger(true)}
                className={"flex-1 rounded-lg border py-1.5 text-sm " + (stagger ? "bg-teal-600 text-white border-transparent" : "border-stone-200 text-stone-500")}>เรียงสลับ (เบียด)</button>
            </div>
          )}

          <div className="rounded-xl bg-teal-50 p-3 flex items-center justify-between">
            <div>
              <div className="text-2xl font-bold text-teal-700 leading-none">~{n} ดวง<span className="text-sm font-normal text-teal-600">/แผ่น</span></div>
              <div className="text-xs text-teal-600/80 mt-1">
                {isCircle ? ("ตาราง " + grid.n + " · สลับ " + hex.n + " ดวง") : (grid.cols + " × " + grid.rows + " ดวง" + (grid.rot ? " (หมุนดวง)" : ""))}
              </div>
            </div>
            <button onClick={save} className="rounded-full bg-teal-600 text-white text-sm font-medium px-4 py-2 active:scale-95">บันทึกไว้</button>
          </div>

          {presets.length > 0 && (

                {presets.map((p) => (
                  <div key={p.id} className="flex items-center justify-between rounded-lg bg-stone-50 px-3 py-2">

                    <span className="flex items-center gap-2">
                      <span className="text-sm font-semibold text-teal-700">{p.n} ดวง</span>
                      <button onClick={() => setPresets((list) => list.filter((x) => x.id !== p.id))} className="text-stone-300 hover:text-red-500"><X size={16} /></button>
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}

/* ============ Shopee daily queue ============ */
const NIGHT_CAP = 5; // ทำได้สูงสุดคืนละ 5 ออเดอร์

function ShopeeQueue({ items, cardProps, blockedSet }) {
  const pri = (t) => (t.orderType === "preorder" ? 1 : 0); // ทั่วไปก่อน
  const sorted = [...items].sort((a, b) => {
    if (pri(a) !== pri(b)) return pri(a) - pri(b);
    const da = daysUntil(a.deadline), db = daysUntil(b.deadline);
    if ((da ?? 999) !== (db ?? 999)) return (da ?? 999) - (db ?? 999);
    return (a.createdAt || 0) - (b.createdAt || 0);
  });
  const days = [];
  for (let i = 0; i < sorted.length; i += NIGHT_CAP) days.push(sorted.slice(i, i + NIGHT_CAP));
  const dates = workingDates(days.length, blockedSet || new Set());
  const dayLabel = (i) => {
    const iso = dates[i];
    if (!iso) return "คืนถัดไป";
    const du = daysUntil(iso);
    if (du === 0) return "คืนนี้ · " + fmtThaiDate(iso);
    if (du === 1) return "พรุ่งนี้ · " + fmtThaiDate(iso);
    return dowShort(iso) + ". " + fmtThaiDate(iso);
  };

  const normalCount = items.filter((t) => t.orderType !== "preorder").length;
  const normalOverflow = Math.max(0, normalCount - NIGHT_CAP);

  return (
    <div className="space-y-4">
      <div className="rounded-2xl border border-teal-200 bg-teal-50 p-3.5">
        <div className="font-semibold text-teal-800">{items.length} ออเดอร์ค้าง · ใช้ ~{days.length} คืน</div>
        <div className="text-xs text-teal-600 mt-0.5">ทำได้คืนละ {NIGHT_CAP} · สินค้าทั่วไปทำก่อน (ควรส่งวันรุ่งขึ้น) · ข้ามวันที่ไม่ว่างให้แล้ว</div>
        {normalOverflow > 0 && (
          <div className="text-xs text-red-600 font-medium mt-1.5 flex items-center gap-1">

const DOW_ABBR = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
const PERIODS = [{ k: "allday", label: "ทั้งวัน" }, { k: "morning", label: "เช้า" }, { k: "noon", label: "กลางวัน" }, { k: "evening", label: "เย็น" }, { k: "night", label: "กลางคืน" }];
const periodLabel = (k) => (PERIODS.find((x) => x.k === k) || {}).label || "";
// จัดวันเรียนตามวันในสัปดาห์ที่เลือก (days = array ของ 0-6) ข้ามวันไม่ว่าง
function courseSchedule(course, blocked) {
  const need = Math.max(0, Number(course.sessions) || 0);
  const days = course.days || [];
  if (!course.start || need === 0 || days.length === 0) return [];
  const out = [];
  const d = new Date(course.start + "T00:00:00");
  let guard = 0;
  while (out.length < need && guard < 3000) {
    const iso = isoOf(d), dow = d.getDay();
    if (days.includes(dow) && !blocked.has(iso)) out.push(iso);
    d.setDate(d.getDate() + 1); guard++;
  }
  return out;
}

/* ============ freelance rate card (แกะแบบ / ออกแบบใหม่) ============ */
const STD_RUSH = [{ label: "ด่วน 3–5 วัน", add: 500, d: 5 }, { label: "ด่วนพิเศษ 1–2 วัน", add: 800, d: 2 }];
const DEFAULT_DAYS = 7; // ทุกงานตีเป็น ~1 สัปดาห์ (ยกเว้น RSC ที่กำหนด d เอง)
const EZMH = [{ label: "ง่าย", price: 500 }, { label: "กลาง", price: 1000 }, { label: "ยาก", price: 1500 }]; // ฉลาก/โลโก้
const RATE_CARD = {
  reverse: {
    rsc: { label: "กล่อง RSC", days: "ปกติ 3–5 วัน",
      options: [{ label: "มีตัวอย่างให้เทียบ", price: 1200, d: 5 }, { label: "มีภาพ / AI อ้างอิง", price: 1500, d: 5 }],
      rush: [{ label: "ด่วน 1–2 วัน", add: 500, d: 2 }] },
    diecut: { label: "กล่องไดคัท",
      options: [{ label: "ไดคัทง่าย", price: 2000 }, { label: "ซับซ้อน / หลายชิ้น", price: 2500, plus: true }],
      rush: STD_RUSH },
    bag: { label: "ถุง", options: [{ label: "ง่าย", price: 1000 }, { label: "ยาก", price: 1500 }], rush: STD_RUSH },
    label: { label: "ฉลาก", options: EZMH, rush: STD_RUSH },
    logo: { label: "โลโก้", options: EZMH, rush: STD_RUSH },
    other: { label: "อื่นๆ", custom: true },
  },
  newdesign: {
    rsc: { label: "กล่อง RSC", tbd: true },
    diecut: { label: "กล่องไดคัท", tbd: true },
    logo: { label: "โลโก้", options: [{ label: "โลโก้ทั่วไป", price: 2000 }], rush: STD_RUSH },
    ci: { label: "CI แบรนด์", options: [{ label: "แบรนด์ไอเดนติตี้", price: 5000 }], rush: STD_RUSH },
    bag: { label: "ถุง", tbd: true },
    label: { label: "ฉลาก", options: EZMH, rush: STD_RUSH },
    other: { label: "อื่นๆ", custom: true },
  },
};
const MODES = [{ k: "reverse", label: "แกะแบบ" }, { k: "newdesign", label: "ออกแบบใหม่" }];
const CATS_BY_MODE = { reverse: ["rsc", "diecut", "bag", "label", "logo", "other"], newdesign: ["rsc", "diecut", "logo", "ci", "bag", "label", "other"] };

// คำนวณราคา+จำนวนวันจากเรท (ใช้ได้ทั้งเครื่องคิดราคาและฟอร์มเพิ่มงาน)
function computeRate(mode, cat, oi, ri, manual) {
  const c = (RATE_CARD[mode] && RATE_CARD[mode][cat]) || RATE_CARD.reverse.rsc;
  const hasOptions = !!c.options;
  const opt = hasOptions ? c.options[oi] : null;
  const rushList = hasOptions ? (c.rush || null) : STD_RUSH;
  const rush = (rushList && ri >= 0) ? rushList[ri] : null;
  const base = hasOptions ? (opt ? opt.price : null) : (Number(manual) > 0 ? Number(manual) : null);
  const price = base != null ? base + (rush ? rush.add : 0) : null;
  const days = rush ? rush.d : (hasOptions ? (opt && opt.d != null ? opt.d : DEFAULT_DAYS) : DEFAULT_DAYS);
  return { price, days, hasOptions, opt, rush, rushList, c, plus: !!(opt && opt.plus) };
}

                  </button>
                ))}
              </div>
            </div>
          )}

          {/* result */}
          {price != null ? (
            <div className="rounded-xl bg-amber-50 p-3">
              <div className="text-2xl font-bold text-amber-700 leading-none">≈ {baht(price)}{opt && opt.plus ? "+" : ""} บาท{timeline ? <span className="text-sm font-normal text-amber-600"> · ~{timeline} วัน</span> : null}</div>

            </div>
          ) : (
            <p className="text-xs text-stone-400">ใส่ราคาฐานเพื่อคำนวณ (แล้วเลือกด่วนได้)</p>

            <AlertTriangle size={16} className="text-rose-500 shrink-0 mt-0.5" />
            <p className="text-xs text-rose-700">เช็กดีเทลงานให้ครบก่อนเคาะราคา — ถ้าจริง ๆ ดีเทลเยอะกว่าที่ลูกค้าบอก ปรับราคาขึ้นได้เลย อย่ายึดราคาแรกที่คุยตอนโจทย์ยังไม่ชัด</p>
          </div>
        </div>
      )}
    </div>
  );
}

                <button onClick={() => setSize("normal")}
                  className={"flex-1 rounded-xl border py-2.5 text-sm font-medium " + (f.size !== "big" ? "bg-stone-900 text-white border-transparent" : "border-stone-200 text-stone-500")}>
                  ธรรมดา · ~30 นาที
                </button>
                <button onClick={() => setSize("big")}
                  className={"flex-1 rounded-xl border py-2.5 text-sm font-medium " + (f.size === "big" ? "bg-stone-900 text-white border-transparent" : "border-stone-200 text-stone-500")}>
                  ใหญ่ · ~1 ชม.
                </button>
              </div>
            </Field>
          )}

          {job === 3 && (
            <button onClick={toggleNeedFile}
              className={"w-full flex items-center gap-3 rounded-xl border p-3 text-left transition " + (f.needFile ? "border-amber-300 bg-amber-50" : "border-stone-200")}>
              <span className={f.needFile ? "text-amber-600" : "text-stone-300"}>{f.needFile ? <CheckCircle2 size={22} /> : <AlertTriangle size={22} />}</span>
              <span className="text-sm">
                <span className="font-medium text-stone-800 block">ต้องเตรียมไฟล์ให้ลูกค้า</span>
                <span className="text-xs text-stone-500">เผื่อเวลาทำไฟล์เพิ่มอีก ~{FILE_PREP_HR} ชม.</span>
              </span>
            </button>
          )}

          <div className="grid grid-cols-2 gap-3">
            <Field label="กำหนดส่ง">
              <input type="date" value={f.deadline || ""} onChange={(e) => set("deadline", e.target.value)}
                className="w-full rounded-xl border border-stone-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400" />
            </Field>
            {job === 3 && (
              <Field label="ชั่วโมงที่คาดว่าใช้">
                <input type="number" step="0.5" min="0" value={f.estHours} onChange={(e) => set("estHours", e.target.value)}
                  className="w-full rounded-xl border border-stone-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400" />
              </Field>
            )}
            {job === 1 && !isContinue && (
              <Field label="วันที่ได้รับงาน">
                <input type="date" value={f.assignedDate || ""} onChange={(e) => set("assignedDate", e.target.value)}
                  className="w-full rounded-xl border border-stone-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400" />
              </Field>
            )}
          </div>

          <Field label="โน้ต">
            <textarea value={f.notes} onChange={(e) => set("notes", e.target.value)} rows={2} placeholder="รายละเอียดเพิ่มเติม…"
              className="w-full rounded-xl border border-stone-300 px-3 py-2.5 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-stone-400" />
          </Field>
        </div>

        <div className="sticky bottom-0 bg-white px-5 py-4 border-t border-stone-100 flex items-center gap-3">
          {!isNew && <button onClick={() => { onRemove(seed.id); onClose(); }} className="p-2.5 rounded-xl text-red-500 hover:bg-red-50"><Trash2 size={20} /></button>}
          <button onClick={save} disabled={!f.title.trim()}
            className={"flex-1 rounded-xl py-3 font-semibold text-white transition " + (f.title.trim() ? a.bg : "bg-stone-300")}>
            {isNew ? "เพิ่มงาน" : "บันทึก"}
          </button>
        </div>
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return <div><label className="block text-xs font-medium text-stone-500 mb-1.5">{label}</label>{children}</div>;
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
